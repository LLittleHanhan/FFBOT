[project]
name = "ffbot"
version = "0.1.0"
description = "一个最小化的 AI Agent 框架，基于 OneBot + OpenAI 兼容 API"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
